<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 상세 - Spring Boot MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/products">Spring Boot MVC - 상품 관리</a>
    </div>
</nav>

<div class="container">
    <div class="mb-3">
        <a th:href="@{/products}" class="btn btn-secondary">← 목록으로</a>
    </div>

    <!-- 메시지 표시 -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">상품 상세 정보</h2>
        </div>
        <div class="card-body">
            <div class="row mb-3">
                <div class="col-md-3"><strong>상품 ID:</strong></div>
                <div class="col-md-9" th:text="${product.id}">1</div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3"><strong>상품명:</strong></div>
                <div class="col-md-9" th:text="${product.name}">노트북</div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3"><strong>가격:</strong></div>
                <div class="col-md-9">
                    <span th:text="${#numbers.formatCurrency(product.price)}" class="fs-4 text-primary fw-bold">₩1,500,000</span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3"><strong>재고:</strong></div>
                <div class="col-md-9">
                    <span th:text="${product.stock}">10</span>개
                    <span th:if="${product.stock < 5}" class="badge bg-warning text-dark ms-2">재고 부족</span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3"><strong>판매 상태:</strong></div>
                <div class="col-md-9">
                    <span th:if="${product.available}" class="badge bg-success">판매중</span>
                    <span th:unless="${product.available}" class="badge bg-danger">품절</span>
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-3"><strong>등록일:</strong></div>
                <div class="col-md-9" th:text="${#temporals.format(product.createdAt, 'yyyy년 MM월 dd일 HH:mm:ss')}">2024-01-15</div>
            </div>
            <div class="row mb-3" th:if="${product.description}">
                <div class="col-md-3"><strong>상품 설명:</strong></div>
                <div class="col-md-9">
                    <p th:text="${product.description}" class="mb-0">상품 설명이 여기에 표시됩니다.</p>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <div class="d-flex gap-2">
                <a th:href="@{/products/{id}/edit(id=${product.id})}" class="btn btn-warning">수정</a>
                <form th:action="@{/products/{id}/delete(id=${product.id})}"
                      method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
                <a th:href="@{/products}" class="btn btn-secondary ms-auto">목록으로</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
