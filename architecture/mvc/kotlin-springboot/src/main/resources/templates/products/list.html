<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 목록 - Spring Boot MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/products">Spring Boot MVC - 상품 관리</a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>상품 목록</h1>
        <a th:href="@{/products/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> 새 상품 등록
        </a>
    </div>

    <!-- 메시지 표시 (Flash Attribute) -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 상품이 없을 때 -->
    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
        등록된 상품이 없습니다. 새 상품을 등록해보세요!
    </div>

    <!-- 상품 목록 테이블 -->
    <div th:unless="${#lists.isEmpty(products)}" class="table-responsive">
        <table class="table table-striped table-hover">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>상품명</th>
                <th>가격</th>
                <th>재고</th>
                <th>상태</th>
                <th>등록일</th>
                <th>작업</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td>
                    <a th:href="@{/products/{id}(id=${product.id})}"
                       th:text="${product.name}"
                       class="text-decoration-none">상품명</a>
                </td>
                <td th:text="${#numbers.formatCurrency(product.price)}">₩1,000</td>
                <td>
                    <span th:text="${product.stock}">10</span>
                    <span th:if="${product.stock < 5}" class="badge bg-warning text-dark ms-1">낮음</span>
                </td>
                <td>
                    <span th:if="${product.available}" class="badge bg-success">판매중</span>
                    <span th:unless="${product.available}" class="badge bg-danger">품절</span>
                </td>
                <td th:text="${#temporals.format(product.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-15</td>
                <td>
                    <div class="btn-group" role="group">
                        <a th:href="@{/products/{id}(id=${product.id})}"
                           class="btn btn-sm btn-info">상세</a>
                        <a th:href="@{/products/{id}/edit(id=${product.id})}"
                           class="btn btn-sm btn-warning">수정</a>
                        <form th:action="@{/products/{id}/delete(id=${product.id})}"
                              method="post"
                              style="display:inline;"
                              onsubmit="return confirm('정말 삭제하시겠습니까?');">
                            <button type="submit" class="btn btn-sm btn-danger">삭제</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="mt-4">
        <p class="text-muted">
            <strong>총 상품 수:</strong> <span th:text="${#lists.size(products)}">0</span>개
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
