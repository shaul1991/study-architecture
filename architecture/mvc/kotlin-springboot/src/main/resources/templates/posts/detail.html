<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${post.title} + ' - Spring Boot MVC'">게시글 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        .post-content {
            white-space: pre-wrap;
            line-height: 1.8;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/posts">
            <i class="bi bi-chat-square-text"></i> Spring Boot MVC Blog
        </a>
    </div>
</nav>

<div class="container">
    <div class="mb-3">
        <a th:href="@{/posts}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> 목록으로
        </a>
    </div>

    <!-- 메시지 표시 -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 게시글 상세 -->
    <div class="card shadow">
        <div class="card-header bg-white py-3">
            <h2 class="mb-2" th:text="${post.title}">게시글 제목</h2>
            <div class="text-muted small">
                <i class="bi bi-person-circle"></i>
                <span th:text="${post.author.displayName != null ? post.author.displayName : post.author.username}">작성자</span>
                <span class="mx-2">|</span>
                <i class="bi bi-calendar"></i>
                <span th:text="${#temporals.format(post.createdAt, 'yyyy년 MM월 dd일 HH:mm:ss')}">2024-01-15</span>
                <span class="mx-2">|</span>
                <i class="bi bi-eye"></i> 조회 <span th:text="${post.viewCount}">0</span>
                <span class="mx-2">|</span>
                <i class="bi bi-chat"></i> 댓글 <span th:text="${post.getCommentCount()}">0</span>
            </div>
            <div th:if="${post.updatedAt != null}" class="text-muted small mt-1">
                <i class="bi bi-pencil"></i> 수정됨:
                <span th:text="${#temporals.format(post.updatedAt, 'yyyy-MM-dd HH:mm')}">2024-01-16</span>
            </div>
        </div>
        <div class="card-body">
            <div class="post-content" th:text="${post.content}">
                게시글 내용이 여기에 표시됩니다.
            </div>
        </div>
        <div class="card-footer bg-transparent">
            <div class="d-flex gap-2">
                <a th:href="@{/posts/{id}/edit(id=${post.id})}" class="btn btn-warning">
                    <i class="bi bi-pencil"></i> 수정
                </a>
                <form th:action="@{/posts/{id}/delete(id=${post.id})}"
                      method="post"
                      onsubmit="return confirm('정말 삭제하시겠습니까?');">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-trash"></i> 삭제
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 댓글 섹션 -->
    <div class="mt-5">
        <h4><i class="bi bi-chat-left-text"></i> 댓글 <span class="badge bg-secondary" th:text="${#lists.size(comments)}">0</span></h4>
        <hr>

        <!-- 댓글이 없을 때 -->
        <div th:if="${#lists.isEmpty(comments)}" class="alert alert-light">
            <i class="bi bi-chat-square-dots"></i> 첫 번째 댓글을 작성해보세요!
        </div>

        <!-- 댓글 목록 -->
        <div th:unless="${#lists.isEmpty(comments)}">
            <div class="card mb-3" th:each="comment : ${comments}">
                <div class="card-body">
                    <div class="d-flex justify-content-between">
                        <h6 class="card-subtitle mb-2 text-muted">
                            <i class="bi bi-person"></i>
                            <span th:text="${comment.author.displayName != null ? comment.author.displayName : comment.author.username}">작성자</span>
                        </h6>
                        <small class="text-muted" th:text="${#temporals.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-15</small>
                    </div>
                    <p class="card-text mt-2" th:text="${comment.content}">댓글 내용</p>
                    <div th:if="${comment.updatedAt != null}" class="text-muted small">
                        <i class="bi bi-pencil"></i> 수정됨
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
