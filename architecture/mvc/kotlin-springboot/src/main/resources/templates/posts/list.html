<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 목록 - Spring Boot MVC</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/posts">
            <i class="bi bi-chat-square-text"></i> Spring Boot MVC Blog
        </a>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><i class="bi bi-list-ul"></i> 게시글 목록</h1>
        <a th:href="@{/posts/new}" class="btn btn-primary">
            <i class="bi bi-pencil-square"></i> 새 게시글 작성
        </a>
    </div>

    <!-- 메시지 표시 -->
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i> <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- 게시글이 없을 때 -->
    <div th:if="${#lists.isEmpty(posts)}" class="alert alert-info">
        <i class="bi bi-info-circle"></i> 등록된 게시글이 없습니다. 첫 번째 게시글을 작성해보세요!
    </div>

    <!-- 게시글 목록 -->
    <div th:unless="${#lists.isEmpty(posts)}">
        <div class="row row-cols-1 row-cols-md-2 g-4">
            <div class="col" th:each="post : ${posts}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">
                            <a th:href="@{/posts/{id}(id=${post.id})}"
                               th:text="${post.title}"
                               class="text-decoration-none">게시글 제목</a>
                        </h5>
                        <p class="card-text text-muted small">
                            <i class="bi bi-person"></i>
                            <span th:text="${post.author.displayName != null ? post.author.displayName : post.author.username}">작성자</span>
                            <span class="mx-2">|</span>
                            <i class="bi bi-calendar"></i>
                            <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-15</span>
                        </p>
                        <p class="card-text" th:text="${#strings.abbreviate(post.content, 100)}">
                            게시글 내용의 미리보기가 여기에 표시됩니다...
                        </p>
                    </div>
                    <div class="card-footer bg-transparent">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <span class="badge bg-secondary">
                                    <i class="bi bi-eye"></i> <span th:text="${post.viewCount}">0</span>
                                </span>
                                <span class="badge bg-info text-dark ms-1">
                                    <i class="bi bi-chat"></i> <span th:text="${post.getCommentCount()}">0</span>
                                </span>
                            </div>
                            <div>
                                <a th:href="@{/posts/{id}(id=${post.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye"></i> 상세보기
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <p class="text-muted">
                <i class="bi bi-archive"></i> <strong>총 게시글 수:</strong> <span th:text="${#lists.size(posts)}">0</span>개
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
