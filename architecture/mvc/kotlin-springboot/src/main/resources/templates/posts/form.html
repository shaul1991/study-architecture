<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit ? '게시글 수정' : '게시글 작성'} + ' - Spring Boot MVC'">게시글 작성</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/posts">
            <i class="bi bi-chat-square-text"></i> Spring Boot MVC Blog
        </a>
    </div>
</nav>

<div class="container">
    <div class="mb-3">
        <a th:href="@{/posts}" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> 목록으로
        </a>
    </div>

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">
                <i th:classappend="${isEdit ? 'bi-pencil' : 'bi-pencil-square'}"></i>
                <span th:text="${isEdit ? '게시글 수정' : '새 게시글 작성'}">새 게시글 작성</span>
            </h2>
        </div>
        <div class="card-body">
            <form th:action="${isEdit ? '/posts/' + postId : '/posts'}"
                  method="post"
                  th:object="${post}">

                <!-- 제목 -->
                <div class="mb-3">
                    <label for="title" class="form-label">
                        <i class="bi bi-card-heading"></i> 제목 <span class="text-danger">*</span>
                    </label>
                    <input type="text"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid' : ''"
                           id="title"
                           th:field="*{title}"
                           placeholder="게시글 제목을 입력하세요">
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">
                        제목 오류 메시지
                    </div>
                </div>

                <!-- 내용 -->
                <div class="mb-3">
                    <label for="content" class="form-label">
                        <i class="bi bi-text-paragraph"></i> 내용 <span class="text-danger">*</span>
                    </label>
                    <textarea class="form-control"
                              th:classappend="${#fields.hasErrors('content')} ? 'is-invalid' : ''"
                              id="content"
                              th:field="*{content}"
                              rows="15"
                              placeholder="게시글 내용을 입력하세요"></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">
                        내용 오류 메시지
                    </div>
                </div>

                <!-- 게시 여부 (작성 시에만) -->
                <div class="mb-3" th:if="${!isEdit}">
                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="published"
                               th:field="*{published}">
                        <label class="form-check-label" for="published">
                            <i class="bi bi-eye"></i> 즉시 게시
                        </label>
                    </div>
                    <small class="form-text text-muted">
                        체크 해제 시 비공개 상태로 저장됩니다.
                    </small>
                </div>

                <!-- 버튼 -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i th:classappend="${isEdit ? 'bi-check-circle' : 'bi-send'}"></i>
                        <span th:text="${isEdit ? '수정 완료' : '작성 완료'}">작성 완료</span>
                    </button>
                    <a th:href="@{/posts}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i> 취소
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- 도움말 -->
    <div class="mt-4">
        <div class="alert alert-info">
            <h5><i class="bi bi-info-circle"></i> 작성 가이드</h5>
            <ul class="mb-0">
                <li><strong>제목:</strong> 2~200자 이내로 입력해주세요.</li>
                <li><strong>내용:</strong> 최소 10자 이상 입력해주세요.</li>
                <li><strong>Markdown:</strong> 향후 Markdown 문법을 지원할 예정입니다.</li>
            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
